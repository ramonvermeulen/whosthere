name: Update OUI Table

on:
  schedule:
    # Quarterly on the first day of January, April, July, and October at 04:00 UTC.
    - cron: "0 4 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-oui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod

      - name: Refresh embedded OUI table
        run: ./scripts/update-oui.sh

      - name: Verify OUI package
        run: go test ./pkg/discovery/oui

      - name: Detect OUI table changes
        id: changes
        run: |
          if git diff --quiet -- pkg/discovery/oui/oui.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove stale update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/update-oui-table"

          if ! git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            exit 0
          fi

          open_prs="$(gh pr list --head "${branch}" --state open --json number --jq 'length')"
          if [ "${open_prs}" = "0" ]; then
            git push origin --delete "${branch}"
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-oui-table
          delete-branch: true
          commit-message: "chore(oui): refresh IEEE OUI table"
          title: "chore(oui): refresh IEEE OUI table"
          body: |
            Automated OUI table refresh from the IEEE registry.

            This PR was created by the scheduled OUI update workflow.
